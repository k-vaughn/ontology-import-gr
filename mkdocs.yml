site_name: The Good Relations Ontology
site_description: The Good Relations ontology converted into a website
repo_url: https://github.com/ISO-TC204/ontology-import-gr
nav:
- Home: index.md
- Good Relations Pattern:
  - Good Relations Pattern: GoodRelationsPattern.md
  - Actual Product Or Service Instance: ActualProductOrServiceInstance.md
  - Brand: Brand.md
  - Business Entity: BusinessEntity.md
  - Business Entity Type: BusinessEntityType.md
  - Business Function: BusinessFunction.md
  - Day Of Week: DayOfWeek.md
  - Delivery Charge Specification: DeliveryChargeSpecification.md
  - Delivery Method: DeliveryMethod.md
  - Delivery Mode Parcel Service: DeliveryModeParcelService.md
  - Individual: Individual.md
  - License: License.md
  - Location: Location.md
  - Location Of Sales Or Service Provisioning: LocationOfSalesOrServiceProvisioning.md
  - N-Ary-Relations: N-Ary-Relations.md
  - Offering: Offering.md
  - Opening Hours Specification: OpeningHoursSpecification.md
  - Payment Charge Specification: PaymentChargeSpecification.md
  - Payment Method: PaymentMethod.md
  - Payment Method Credit Card: PaymentMethodCreditCard.md
  - Price Specification: PriceSpecification.md
  - Product Or Service: ProductOrService.md
  - Product Or Service Model: ProductOrServiceModel.md
  - Product Or Services Some Instances Placeholder: ProductOrServicesSomeInstancesPlaceholder.md
  - Qualitative Value: QualitativeValue.md
  - Quantitative Value: QuantitativeValue.md
  - Quantitative Value Float: QuantitativeValueFloat.md
  - Quantitative Value Integer: QuantitativeValueInteger.md
  - Some Items: SomeItems.md
  - Type And Quantity Node: TypeAndQuantityNode.md
  - Unit Price Specification: UnitPriceSpecification.md
  - Warranty Promise: WarrantyPromise.md
  - Warranty Scope: WarrantyScope.md
site_url: https://isotc204.org/ontology-import-gr/
copyright: <p xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/">
  <a href="https://creativecommons.org/licenses/by/4.0/?ref=chooser-v1" target="_blank"
  rel="license noopener noreferrer" style="display:inline-block;">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;"
  src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt=""><img
  style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1"
  alt=""></a></p>
theme:
  name: material
  features:
  - content.code.copy
  - content.status
  - content.tooltips
  - icons
  - navigation.path
  - navigation.top
  icon:
    repo: fontawesome/brands/github
    admonition:
      question: fontawesome/solid/comments
  palette:
  - scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
- javascripts/tablesort.js
plugins:
- search
- git-revision-date-localized:
    type: date
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- md_in_html
- meta
- footnotes
- pymdownx.blocks.caption
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path: docs
    check_paths: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: ''
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true
extra:
  search:
    highlight: true
  hide:
  - title
  version:
    provider: mike
    alias: true
    default: latest
